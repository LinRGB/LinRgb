[package]
name = "linrgb"
version = "1.0.0-beta.4"
edition = "2024"
# Original LinRGB software; bundled material is identified in notices/README.txt.
license = "MIT"
description = "Native RGB lighting control for Linux"

[dependencies]
gtk = { package = "gtk4", version = "0.10" }
i2cdev = "0.6.2"
libc = "0.2.191"
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
udev = { version = "0.9.3", default-features = false }
