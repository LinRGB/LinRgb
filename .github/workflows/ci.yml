name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@19effe9fe722874e6d46dd7182e4b8b7a43c4a99 # v31.10.0
      - run: nix develop --no-update-lock-file -c cargo fmt --all -- --check
      - run: python3 tools/sync_ene_udev.py --check
      - run: nix develop --no-update-lock-file -c cargo test --all-targets --locked
      - run: nix flake check --no-update-lock-file -L
      - run: nix develop --no-update-lock-file -c cargo clippy --locked --all-targets -- -D warnings
